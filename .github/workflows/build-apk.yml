      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Beri nama APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk KASIRKU.apk

      - name: Simpan APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: KASIRKU-apk
          path: KASIRKU.apk
          if-no-files-found: error

      - name: Terbitkan ke Releases (unduh langsung .apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.APP_NAME }} build ${{ github.run_number }}
          files: KASIRKU.apk
