# KASIRKU: mengemas link web menjadi aplikasi Android (APK) di GitHub Actions
#
# Cara pakai:
#   1. Simpan file ini di repository dengan nama .github/workflows/build-apk.yml
#   2. (Opsional) upload logo bernama icon.png ke folder utama repository
#   3. Buka tab Actions > Build APK > Run workflow. Hasil APK ada di Releases.
#
# Mengganti link atau nama aplikasi: ubah dua baris di bagian env di bawah ini.

name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Diperlukan supaya APK bisa diterbitkan ke halaman Releases
permissions:
  contents: write

env:
  WEB_URL: "https://kasirku.freesrv.com/"
  APP_NAME: "KASIRKU"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Susun proyek Android
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/nurz/kasirku android/app/src/main/res/values android/app/src/main/res/values-night
          cd android

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KASIRKU"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          def serverUrl = (project.findProperty('SERVER_URL') ?: 'https://kasirku.freesrv.com/').toString()
          def appName = (project.findProperty('APP_NAME') ?: 'KASIRKU').toString()
          def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

          android {
              namespace 'com.nurz.kasirku'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.nurz.kasirku'
                  minSdk 24
                  targetSdk 34
                  versionCode runNumber
                  versionName '1.1'
                  buildConfigField 'String', 'SERVER_URL', "\"${serverUrl}\""
                  resValue 'string', 'app_name', appName
              }

              // Kunci penanda tetap supaya APK versi baru bisa dipasang menimpa versi lama.
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              buildFeatures {
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/java/com/nurz/kasirku/MainActivity.java <<'EOF'
          package com.nurz.kasirku;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final String HOME = BuildConfig.SERVER_URL;

              // Menutup keranjang atau jendela yang sedang terbuka di halaman. Mengembalikan "closed" kalau ada yang ditutup.
              private static final String CLOSE_JS =
                      "(function(){var o=document.getElementById('overlay');var c=document.getElementById('cart');"
                      + "var open=(o&&!o.hidden)||(c&&c.classList.contains('open'));"
                      + "if(open){document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));return 'closed'}"
                      + "return 'none'})()";

              private WebView web;
              private long lastBack = 0;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setTextZoom(100);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  web.addJavascriptInterface(new Bridge(), "AndroidApp");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if (sameSite(u)) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) showError(view);
                      }
                  });

                  if (state == null || web.restoreState(state) == null) {
                      web.loadUrl(HOME);
                  }
              }

              private boolean sameSite(Uri u) {
                  String home = Uri.parse(HOME).getHost();
                  return home != null && home.equalsIgnoreCase(u.getHost());
              }

              private void showError(WebView view) {
                  String html = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head>"
                          + "<body style='font-family:sans-serif;background:#0E1412;color:#E7EEEB;margin:0;padding:24px;"
                          + "min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center'>"
                          + "<h2>Tidak bisa terhubung</h2>"
                          + "<p style='opacity:.7'>Periksa koneksi internet, lalu coba lagi.</p>"
                          + "<button onclick=\"location.href='" + HOME + "'\" "
                          + "style='background:#3DC9A5;color:#06251D;border:0;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:600'>"
                          + "Coba lagi</button></body></html>";
                  view.loadDataWithBaseURL(HOME, html, "text/html", "utf-8", null);
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript(CLOSE_JS, value -> {
                      if ("\"closed\"".equals(value)) return;
                      if (web.canGoBack()) {
                          web.goBack();
                          return;
                      }
                      long now = System.currentTimeMillis();
                      if (now - lastBack < 2000) {
                          finish();
                      } else {
                          lastBack = now;
                          Toast.makeText(this, "Tekan sekali lagi untuk keluar", Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onPause() {
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onDestroy() {
                  web.destroy();
                  super.onDestroy();
              }

              /** Dipanggil dari halaman untuk menyalin teks (clipboard web tidak tersedia di WebView). */
              public class Bridge {
                  @JavascriptInterface
                  public void copy(String text) {
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      if (cm != null) cm.setPrimaryClip(ClipData.newPlainText("KASIRKU", text));
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#F1F4F2</item>
                  <item name="android:windowBackground">#F1F4F2</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values-night/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0E1412</item>
                  <item name="android:windowBackground">#0E1412</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  __ICON_ATTRS__
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          {
            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"
            echo "android.useAndroidX=false"
            echo "android.nonTransitiveRClass=true"
            echo "SERVER_URL=$WEB_URL"
            echo "APP_NAME=$APP_NAME"
          } > gradle.properties

          # kunci penanda aplikasi (tetap, supaya APK baru bisa menimpa yang lama)
          base64 -d > app/debug.keystore <<'KS'
