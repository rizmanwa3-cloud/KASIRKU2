          # ikon: pakai icon.png di folder utama repository kalau ada
          ICON_ATTRS=""
          if [ -f ../icon.png ]; then
            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq imagemagick
            fi
            R=app/src/main/res
            for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${spec%%:*}; s=${spec##*:}
              full=$((s * 9 / 4)); inner=$((full * 70 / 100))
              mkdir -p $R/mipmap-$d
              convert ../icon.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
              convert ../icon.png -resize ${inner}x${inner} -background none -gravity center -extent ${full}x${full} $R/mipmap-$d/ic_launcher_foreground.png
